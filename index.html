<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>รับงานโดรนเกษตร</title>
<style>
:root{--bg:#F1F3EA;--ink:#1B2318;--muted:#66705F;--green:#2E6B35;--line:#DDE3D3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 24px;max-width:420px;width:100%;text-align:center}
h1{font-size:21px;margin:12px 0 6px}
p{color:var(--muted);line-height:1.6;margin:0}
</style>
</head>
<body>
<div class="box">
  <svg width="54" height="54" viewBox="0 0 40 40" fill="none" stroke="#2E6B35" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5"/><circle cx="31" cy="9" r="5"/><circle cx="9" cy="31" r="5"/><circle cx="31" cy="31" r="5"/><path d="M13 13l4 4M27 13l-4 4M13 27l4-4M27 27l-4-4"/><rect x="16" y="16" width="8" height="8" rx="2" fill="#2E6B35"/></svg>
  <h1>รับงานโดรนเกษตร</h1>
  <p>เว็บนี้ปิดใช้งานแล้ว<br>แอปย้ายกลับไปใช้ในแอป Claude ตามเดิม</p>
</div>
</body>
</html>
